<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f0a2e">
<title>داليا الصلوي ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --rose-light:#ff6b9d;
  --rose-mid:#c2185b;
  --rose-deep:#4a0a1f;
  --gold:#f4cf86;
  --gold-light:#fff0c2;
  --pink-pale:#fce4ec;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#08010f;
  font-family:'Aref Ruqaa',serif;
  -webkit-font-smoothing:antialiased;
}

.scene{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 25% 20%, rgba(176,49,109,0.45) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 75% 80%, rgba(91,30,122,0.5) 0%, transparent 60%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(255,107,157,0.12) 0%, transparent 70%),
    linear-gradient(135deg,#08010f 0%,#1a0626 25%,#2a0a3d 50%,#3b0f2a 75%,#52124a 100%);
  overflow:hidden;
}

.scene::after{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.65) 100%);
  pointer-events:none;
  z-index:8;
}

.stars{position:absolute;inset:0;z-index:1;will-change:transform;}
.star{
  position:absolute;
  background:white;
  border-radius:50%;
  box-shadow:0 0 6px white, 0 0 14px rgba(255,255,255,0.5);
  animation:twinkle var(--dur,3s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes twinkle{
  0%,100%{opacity:0.2;transform:scale(0.6);}
  50%{opacity:1;transform:scale(1.3);}
}

#bokeh{position:absolute;inset:0;z-index:2;}

.petals{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;will-change:transform;}
.petal{
  position:absolute;
  width:14px;height:20px;
  background:linear-gradient(135deg, var(--c1,#ff6b9d) 0%, var(--c2,#c2185b) 100%);
  border-radius:100% 0% 100% 0% / 100% 0% 100% 0%;
  opacity:0;
  filter:drop-shadow(0 0 4px rgba(255,100,150,0.4));
  animation:fall var(--dur,12s) linear infinite;
  animation-delay:var(--delay,0s);
  will-change:transform,opacity;
}
@keyframes fall{
  0%{opacity:0;transform:translateY(-12vh) translateX(0) rotate(0deg) scale(0.8);}
  8%{opacity:var(--alpha,0.7);}
  92%{opacity:var(--alpha,0.7);}
  100%{opacity:0;transform:translateY(115vh) translateX(var(--drift,60px)) rotate(720deg) scale(1.1);}
}

.roses-stage{position:absolute;inset:0;z-index:5;will-change:transform;}
.rose-pos{
  position:absolute;
  width:var(--size,80px);height:var(--size,80px);
  left:50%;top:50%;
  margin-left:calc(var(--size,80px) / -2);
  margin-top:calc(var(--size,80px) / -2);
  transform:translate(var(--x,0), var(--y,0));
}
.rose{
  width:100%;height:100%;
  opacity:0;
  transform:scale(0) rotate(var(--start-rot,0deg));
  filter:blur(10px);
  animation-name:bloom, spread, sway;
  animation-duration:2.4s, 2.5s, 6s;
  animation-timing-function:cubic-bezier(0.34,1.56,0.64,1), cubic-bezier(0.65,0,0.35,1), ease-in-out;
  animation-fill-mode:forwards, forwards, none;
  animation-delay:var(--delay,0s), var(--spread-delay,3.8s), 7s;
  animation-iteration-count:1, 1, infinite;
  will-change:transform,opacity,filter;
}
@keyframes bloom{
  0%{opacity:0;transform:scale(0) rotate(var(--start-rot,0deg));filter:blur(10px);}
  35%{opacity:1;transform:scale(0.65) rotate(calc(var(--start-rot,0deg) + 110deg));filter:blur(3px);}
  100%{opacity:1;transform:scale(1) rotate(calc(var(--start-rot,0deg) + 200deg));filter:blur(0);}
}
@keyframes spread{
  0%{transform:scale(1) rotate(calc(var(--start-rot,0deg) + 200deg)) translate(0,0);}
  100%{transform:scale(0.82) rotate(calc(var(--start-rot,0deg) + 240deg)) translate(var(--tx,0), var(--ty,0));}
}
@keyframes sway{
  0%,100%{margin-left:calc(var(--size,80px) / -2);}
  50%{margin-left:calc(var(--size,80px) / -2 + 3px);}
}
.rose svg{
  width:100%;height:100%;
  display:block;
  filter:drop-shadow(0 0 10px rgba(255,90,130,0.55)) drop-shadow(0 0 22px rgba(231,30,99,0.35));
}

.name-wrap{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:7;
  pointer-events:none;
  padding:1rem;
  will-change:transform;
}

.name-glow{
  position:absolute;
  width:80vmin;height:80vmin;
  max-width:720px;max-height:720px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,90,150,0.38) 0%,
    rgba(244,207,134,0.2) 28%,
    rgba(180,80,180,0.12) 50%,
    transparent 70%);
  filter:blur(55px);
  opacity:0;
  animation:glow-in 4s ease-out 4.4s forwards, glow-pulse 5s ease-in-out 8s infinite;
  pointer-events:none;
}
@keyframes glow-in{
  0%{opacity:0;transform:scale(0.35);}
  100%{opacity:1;transform:scale(1.15);}
}
@keyframes glow-pulse{
  0%,100%{transform:scale(1.15);opacity:1;}
  50%{transform:scale(1.25);opacity:0.85;}
}

.name{
  font-family:'Aref Ruqaa',serif;
  font-size:clamp(2.7rem,11vw,7rem);
  font-weight:700;
  background:linear-gradient(135deg,
    #fce4ec 0%, #f8bbd0 12%, #f4cf86 30%, #fff0c2 45%,
    #ffe9a8 55%, #f4cf86 70%, #f8bbd0 88%, #fce4ec 100%);
  background-size:280% 280%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  text-align:center;
  opacity:0;
  transform:scale(0.55);
  filter:blur(28px);
  letter-spacing:0.6em;
  animation:reveal-name 3.6s cubic-bezier(0.16,1,0.3,1) 4.7s forwards,
            shimmer 6s ease-in-out 8.3s infinite;
  position:relative;
  z-index:2;
  line-height:1.15;
  padding:0 0.1em;
}
@keyframes reveal-name{
  0%{opacity:0;transform:scale(0.55);filter:blur(28px) drop-shadow(0 0 0 transparent);letter-spacing:0.6em;}
  55%{opacity:1;transform:scale(1.07);filter:blur(3px) drop-shadow(0 0 20px rgba(255,220,230,0.4));letter-spacing:0.06em;}
  100%{opacity:1;transform:scale(1);filter:blur(0)
    drop-shadow(0 0 25px rgba(255,220,230,0.55))
    drop-shadow(0 0 50px rgba(244,207,134,0.35))
    drop-shadow(0 0 80px rgba(255,90,150,0.25));
    letter-spacing:0.04em;}
}
@keyframes shimmer{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

.ornament{
  display:block;
  color:var(--gold);
  font-size:clamp(0.9rem,1.6vw,1.3rem);
  margin-top:0.8rem;
  opacity:0;
  letter-spacing:1em;
  text-indent:1em;
  animation:fade-up 2s ease-out 6.8s forwards;
  filter:drop-shadow(0 0 10px rgba(244,207,134,0.7));
  z-index:2;
  position:relative;
}

.tagline{
  font-family:'Amiri',serif;
  font-style:italic;
  font-size:clamp(0.95rem,2.2vw,1.45rem);
  color:rgba(255,220,235,0.92);
  margin-top:1.2rem;
  opacity:0;
  letter-spacing:0.03em;
  text-shadow:0 0 18px rgba(255,100,150,0.55), 0 0 35px rgba(244,207,134,0.25);
  animation:fade-up 2s ease-out 7.3s forwards;
  position:relative;
  z-index:2;
  text-align:center;
  max-width:92vw;
  line-height:1.6;
}
@keyframes fade-up{
  0%{opacity:0;transform:translateY(20px);}
  100%{opacity:1;transform:translateY(0);}
}

.tagline .heart{
  display:inline-block;
  color:#ff4d6d;
  margin-inline-start:0.3em;
  text-shadow:0 0 14px rgba(255,77,109,0.9), 0 0 28px rgba(255,77,109,0.5);
  animation:heartbeat 1.6s ease-in-out 8s infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  10%,30%{transform:scale(1.28);}
  20%{transform:scale(0.94);}
}

/* Sparkles around name */
.sparkles{
  position:absolute;
  width:100%;
  max-width:600px;
  height:300px;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:6;
  pointer-events:none;
}
.sparkle{
  position:absolute;
  width:4px;height:4px;
  background:radial-gradient(circle, var(--gold-light) 0%, var(--gold) 50%, transparent 80%);
  border-radius:50%;
  opacity:0;
  animation:sparkle-pop var(--dur,3s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
  box-shadow:0 0 8px var(--gold), 0 0 14px rgba(244,207,134,0.6);
}
@keyframes sparkle-pop{
  0%,100%{opacity:0;transform:scale(0);}
  50%{opacity:1;transform:scale(1.5);}
}

@media (max-width:600px){
  .name{letter-spacing:0.04em;}
  .ornament{letter-spacing:0.6em;}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.5s !important;
    animation-iteration-count:1 !important;
    transition-duration:0.5s !important;
  }
  .name,.tagline,.ornament,.rose,.name-glow{opacity:1 !important;}
}
</style>
</head>
<body>
<div class="scene">
  <div class="stars" id="stars"></div>
  <canvas id="bokeh"></canvas>
  <div class="petals" id="petals"></div>
  <div class="roses-stage" id="roses"></div>
  <div class="sparkles" id="sparkles"></div>
  <div class="name-wrap">
    <div class="name-glow"></div>
    <h1 class="name">داليا الصلوي</h1>
    <span class="ornament">✦ ❀ ✦</span>
    <p class="tagline">إلى داليا الصلوي، أجمل وردة في عالمي<span class="heart">♥</span></p>
  </div>
</div>

<script>
const isMobile = window.innerWidth < 700;
const isLowEnd = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;

/* ========== Rose SVG generator ========== */
let roseIdCounter = 0;
function roseSvg(c1, c2, c3){
  const id = 'r' + (roseIdCounter++);
  const layers = [];
  // 5 outer petals
  for(let i=0;i<5;i++){
    const rot = i*72;
    layers.push(`<g transform="rotate(${rot})"><path d="M 0 -3 C -16 -7, -22 -27, -11 -38 C -5 -42, 5 -42, 11 -38 C 22 -27, 16 -7, 0 -3 Z" fill="url(#${id}-g1)" opacity="0.95"/></g>`);
  }
  // 5 mid petals offset 36°
  for(let i=0;i<5;i++){
    const rot = i*72 + 36;
    layers.push(`<g transform="rotate(${rot})"><path d="M 0 -2 C -11 -5, -15 -21, -7 -29 C -3 -32, 3 -32, 7 -29 C 15 -21, 11 -5, 0 -2 Z" fill="url(#${id}-g2)" opacity="0.96"/></g>`);
  }
  // 5 inner petals offset 18°
  for(let i=0;i<5;i++){
    const rot = i*72 + 18;
    layers.push(`<g transform="rotate(${rot})"><path d="M 0 -1 C -7 -3, -10 -14, -4 -20 C -1 -22, 1 -22, 4 -20 C 10 -14, 7 -3, 0 -1 Z" fill="url(#${id}-g3)" opacity="0.96"/></g>`);
  }
  // Center bud (layered)
  layers.push(`<circle r="5" fill="${c3}" opacity="0.95"/>`);
  layers.push(`<circle r="2.8" fill="${c2}" opacity="0.85"/>`);
  layers.push(`<circle r="1.2" fill="${c1}" opacity="0.7"/>`);

  return `<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="${id}-g1" cx="40%" cy="32%" r="70%">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="55%" stop-color="${c2}"/>
        <stop offset="100%" stop-color="${c3}"/>
      </radialGradient>
      <radialGradient id="${id}-g2" cx="45%" cy="38%" r="70%">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="70%" stop-color="${c2}"/>
        <stop offset="100%" stop-color="${c3}"/>
      </radialGradient>
      <radialGradient id="${id}-g3" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </radialGradient>
    </defs>
    <g>${layers.join('')}</g>
  </svg>`;
}

const rosePalettes = [
  ['#ffb3c6', '#e91e63', '#5e0a2a'],   // classic red-pink
  ['#ff8fab', '#c2185b', '#4a0a1f'],   // deep pink
  ['#ffd1dc', '#ad1457', '#3d0817'],   // soft pink
  ['#ff6b9d', '#880e4f', '#2e0510'],   // velvet red
  ['#fbc2eb', '#a8327d', '#4a0e3d'],   // lavender pink
  ['#ff9a8b', '#d63384', '#56063a'],   // coral pink
  ['#ffc1cc', '#e91e63', '#4a0a1f'],   // blush
];

/* ========== Stars ========== */
const starsEl = document.getElementById('stars');
const starCount = isLowEnd ? 60 : (isMobile ? 100 : 170);
for(let i=0;i<starCount;i++){
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random()*100 + '%';
  s.style.top = Math.random()*100 + '%';
  s.style.setProperty('--delay', Math.random()*3 + 's');
  s.style.setProperty('--dur', (2 + Math.random()*4) + 's');
  const size = 1 + Math.random()*2.3;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  starsEl.appendChild(s);
}

/* ========== Bokeh canvas ========== */
const canvas = document.getElementById('bokeh');
const ctx = canvas.getContext('2d');
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
resize();

const bokehCount = isLowEnd ? 18 : (isMobile ? 28 : 50);
const bokehParticles = [];
for(let i=0;i<bokehCount;i++){
  bokehParticles.push({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: 30 + Math.random()*110,
    vx: (Math.random()-0.5)*0.25,
    vy: -0.05 - Math.random()*0.28,
    hue: 305 + Math.random()*55,
    alpha: 0.04 + Math.random()*0.16
  });
}

function drawBokeh(){
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.globalCompositeOperation = 'lighter';
  for(const p of bokehParticles){
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    grad.addColorStop(0, `hsla(${p.hue}, 75%, 75%, ${p.alpha})`);
    grad.addColorStop(0.45, `hsla(${p.hue}, 75%, 60%, ${p.alpha*0.4})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;
    if(p.y < -p.r){ p.y = window.innerHeight + p.r; p.x = Math.random()*window.innerWidth; }
    if(p.x < -p.r) p.x = window.innerWidth + p.r;
    if(p.x > window.innerWidth + p.r) p.x = -p.r;
  }
  requestAnimationFrame(drawBokeh);
}
drawBokeh();

/* ========== Falling petals ========== */
const petalsEl = document.getElementById('petals');
const petalColors = [
  ['#ff6b9d', '#c2185b'],
  ['#ffb3c6', '#e91e63'],
  ['#ff8fab', '#880e4f'],
  ['#fce4ec', '#f48fb1'],
  ['#ffafcc', '#ad1457'],
  ['#ffd6e0', '#d63384'],
];

function spawnPetal(initial=false){
  const p = document.createElement('div');
  p.className = 'petal';
  p.style.left = Math.random()*100 + 'vw';
  const colors = petalColors[Math.floor(Math.random()*petalColors.length)];
  p.style.setProperty('--c1', colors[0]);
  p.style.setProperty('--c2', colors[1]);
  const dur = 9 + Math.random()*12;
  p.style.setProperty('--dur', dur + 's');
  p.style.setProperty('--drift', (Math.random()*280 - 140) + 'px');
  p.style.setProperty('--alpha', 0.5 + Math.random()*0.4);
  if(initial){
    p.style.animationDelay = '-' + Math.random()*dur + 's';
  }
  const size = 9 + Math.random()*13;
  p.style.width = size + 'px';
  p.style.height = (size*1.4) + 'px';
  petalsEl.appendChild(p);
  setTimeout(()=> p.remove(), dur*1000 + 500);
}

const initialPetals = isLowEnd ? 12 : (isMobile ? 20 : 32);
for(let i=0;i<initialPetals;i++) spawnPetal(true);
setInterval(spawnPetal, isLowEnd ? 600 : (isMobile ? 450 : 320));

/* ========== Roses ring ========== */
const rosesEl = document.getElementById('roses');
const minDim = Math.min(window.innerWidth, window.innerHeight);
const scale = minDim / (isMobile ? 600 : 900);

const ringConfig = isMobile
  ? [
      { radius: 85*scale,  count: 7,  size: 64*scale },
      { radius: 150*scale, count: 11, size: 54*scale },
      { radius: 215*scale, count: 15, size: 44*scale },
    ]
  : [
      { radius: 180, count: 9,  size: 100 },
      { radius: 280, count: 13, size: 82 },
      { radius: 380, count: 17, size: 68 },
    ];

let roseIdx = 0;
const totalRoses = ringConfig.reduce((s,r)=> s+r.count, 0);
const bloomWindow = 3.2;
const spreadStart = 3.9;

ringConfig.forEach((ring, ringIdx) => {
  for(let i=0;i<ring.count;i++){
    const angleOffset = ringIdx * (Math.PI/9) + (Math.random()-0.5)*0.15;
    const angle = (i/ring.count) * Math.PI*2 + angleOffset;
    const x = Math.cos(angle) * ring.radius;
    const y = Math.sin(angle) * ring.radius;

    const pos = document.createElement('div');
    pos.className = 'rose-pos';
    const sizeVar = ring.size + (Math.random()*18 - 9);
    pos.style.setProperty('--size', sizeVar + 'px');
    pos.style.setProperty('--x', x + 'px');
    pos.style.setProperty('--y', y + 'px');

    const rose = document.createElement('div');
    rose.className = 'rose';
    const delay = (roseIdx / totalRoses) * bloomWindow;
    rose.style.setProperty('--delay', delay + 's');
    rose.style.setProperty('--spread-delay', (spreadStart + delay*0.15) + 's');
    rose.style.setProperty('--start-rot', (Math.random()*360) + 'deg');

    const spreadDist = isMobile ? (30*scale) : 60;
    rose.style.setProperty('--tx', (Math.cos(angle) * spreadDist) + 'px');
    rose.style.setProperty('--ty', (Math.sin(angle) * spreadDist) + 'px');

    const palette = rosePalettes[Math.floor(Math.random()*rosePalettes.length)];
    rose.innerHTML = roseSvg(palette[0], palette[1], palette[2]);

    pos.appendChild(rose);
    rosesEl.appendChild(pos);
    roseIdx++;
  }
});

/* ========== Sparkles around name ========== */
const sparklesEl = document.getElementById('sparkles');
const sparkleCount = isLowEnd ? 12 : 22;
for(let i=0;i<sparkleCount;i++){
  const sp = document.createElement('div');
  sp.className = 'sparkle';
  // Position around an ellipse centered on the name
  const t = Math.random() * Math.PI * 2;
  const rx = 30 + Math.random()*40;
  const ry = 15 + Math.random()*25;
  sp.style.left = (50 + Math.cos(t)*rx) + '%';
  sp.style.top  = (50 + Math.sin(t)*ry) + '%';
  sp.style.setProperty('--dur', (2 + Math.random()*3) + 's');
  sp.style.setProperty('--delay', (5.5 + Math.random()*4) + 's');
  const size = 3 + Math.random()*5;
  sp.style.width = size + 'px';
  sp.style.height = size + 'px';
  sparklesEl.appendChild(sp);
}

/* ========== Parallax (depth) ========== */
let mx=0, my=0, tmx=0, tmy=0;
window.addEventListener('mousemove', (e) => {
  tmx = (e.clientX / window.innerWidth - 0.5);
  tmy = (e.clientY / window.innerHeight - 0.5);
});
window.addEventListener('deviceorientation', (e) => {
  if(e.gamma != null && e.beta != null){
    tmx = Math.max(-1, Math.min(1, e.gamma / 35));
    tmy = Math.max(-1, Math.min(1, (e.beta-40) / 35));
  }
});

const nameWrap = document.querySelector('.name-wrap');
function parallaxLoop(){
  mx += (tmx - mx) * 0.045;
  my += (tmy - my) * 0.045;
  rosesEl.style.transform = `translate(${mx*22}px, ${my*22}px)`;
  petalsEl.style.transform = `translate(${mx*32}px, ${my*32}px)`;
  starsEl.style.transform = `translate(${mx*-14}px, ${my*-14}px)`;
  nameWrap.style.transform = `translate(${mx*7}px, ${my*7}px)`;
  requestAnimationFrame(parallaxLoop);
}
parallaxLoop();

/* ========== Click / tap: burst of petals ========== */
function burstPetals(x, y){
  for(let i=0;i<12;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.position = 'absolute';
    const colors = petalColors[Math.floor(Math.random()*petalColors.length)];
    p.style.setProperty('--c1', colors[0]);
    p.style.setProperty('--c2', colors[1]);
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*180;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 50;
    p.style.width = '12px';
    p.style.height = '17px';
    p.style.opacity = '1';
    p.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(0.6)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random()*720}deg) scale(1.1)`, opacity: 0 }
    ], { duration: 1800 + Math.random()*800, easing: 'cubic-bezier(0.22,1,0.36,1)', fill: 'forwards' });
    petalsEl.appendChild(p);
    setTimeout(()=> p.remove(), 2700);
  }
}

document.addEventListener('click', (e) => burstPetals(e.clientX, e.clientY));
document.addEventListener('touchstart', (e) => {
  if(e.touches[0]) burstPetals(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

/* ========== iOS motion permission (tap to enable parallax on iOS 13+) ========== */
if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
  const askOnce = () => {
    DeviceOrientationEvent.requestPermission().catch(()=>{});
    document.removeEventListener('touchend', askOnce);
  };
  document.addEventListener('touchend', askOnce, { once: true });
}
</script>
